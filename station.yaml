# Default filename: station.yaml. Override with `radio station --config <path>`.
# Pairs with a Lua script, default filename station.lua, override with
# `radio station --script <path>`. Any trailing CLI args after these flags
# are passed through to the script unparsed, exposed as `radio.args`.

server:
  grpc_addr: "https://radio-rpc.tbt.services"

auth:
  # Signed via `radio tokengen -secret <server.yaml auth.jwt_secret> -ttl 8760h
  # radio-los-santos playback-fm bounce-fm sf-ur radio-x csr k-dst k-jah-west
  # k-rose master-sounds wctr`.
  # Authorizes all eleven GTA:SA slugs station.lua knows about and expires in
  # ~1 year. Left empty here deliberately -- a ~1yr bearer token doesn't
  # belong in git history or a baked Docker image layer. Supply it via the
  # GORADIO_JWT env var instead (a k8s Secret), which takes precedence over
  # this file's value.
  jwt: ""

station:
  slug: "radio-los-santos"

api:
  enabled: false
  bind_host: "127.0.0.1:8091"
  api_key: "CHANGE_ME"

logging:
  level: "info"
